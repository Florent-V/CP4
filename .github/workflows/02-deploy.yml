name: Deploy to Production

on:
  push:
    branches:
      - prod

# Prevent concurrent deployments — a deploy in progress must finish before
# the next one starts. cancel-in-progress: false ensures we never leave
# production in a half-deployed state.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔍 Pre-deployment info
        run: |
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"

      - name: 🚀 Deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
              echo "🚀 Début du déploiement automatique"
              cd ${{ secrets.DEPLOY_PATH }}
              bash ~/deploy-kopeck.sh
              echo "✅ Déploiement terminé"

      - name: 🎉 Succès
        if: success()
        run: echo "Déploiement réussi en production (commit ${{ github.sha }})"

      - name: 💥 Échec
        if: failure()
        run: echo "Échec du déploiement — vérifier les logs SSH ci-dessus"
