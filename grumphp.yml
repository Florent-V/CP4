grumphp:
    tasks:
        composer:
            file: ./composer.json
        phpversion:
            project: '8.3'
        phpcs:
            standard: 'phpcs.xml.dist'
            ignore_patterns: [ 'migrations']
        phpstan:
            configuration: ./phpstan.dist.neon
            level: 5
        phpmd:
            whitelist_patterns:
                - 'src'
            exclude:
                - '\src\Kernel.php'
                - '\src\Entity\Annonce.php'
            ruleset:
                - 'phpmd.xml'
        twigcs:
            path: '.'
            severity: 'warning'
            display: 'all'
            ruleset: 'FriendsOfTwig\Twigcs\Ruleset\Official'
            triggered_by: [ 'twig' ]
            exclude: [ 'vendor' ]
        twigcsfixer:
            paths: [ ]
            level: ~
            config: ~
            report: 'text'
            no-cache: false
            verbose: false
            triggered_by: [ 'twig' ]
    fixer:
        enabled: true
        fix_by_default: true
